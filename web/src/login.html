<!DOCTYPE html>
<html lang="tr" data-theme="">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Decco OS — Giriş</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080b12;
      --glass:     rgba(20,24,38,.75);
      --border:    rgba(255,255,255,.08);
      --text:      #e8eaf0;
      --muted:     rgba(255,255,255,.4);
      --primary:   #22c55e;
      --primary-d: #16a34a;
      --error:     #fca5a5;
      --error-bg:  rgba(220,38,38,.12);
      --input-bg:  rgba(255,255,255,.06);
      --input-border: rgba(255,255,255,.1);
      --input-focus: rgba(34,197,94,.4);
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* Animated background */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(34,197,94,.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(59,130,246,.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(124,58,237,.04) 0%, transparent 60%);
    }

    /* Grid overlay */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Floating orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; top: -100px; left: -100px; background: rgba(34,197,94,.04); animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; bottom: -80px; right: -60px; background: rgba(59,130,246,.04); animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; top: 40%; right: 20%; background: rgba(124,58,237,.03); animation-delay: -8s; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(20px,-20px) scale(1.05); }
      66%      { transform: translate(-10px,15px) scale(.96); }
    }

    /* Screen layout */
    .screen {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 0;
    }

    /* Top bar (OS menubar) */
    .menubar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 24px;
      background: rgba(8,11,18,.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      font-size: .78rem; color: var(--muted);
    }
    .menubar-logo { font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .menubar-logo .dot { color: var(--primary); }
    .menubar-clock { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

    /* Login card */
    .login-card {
      background: var(--glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04),
        0 24px 60px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.06);
      animation: cardIn .5s cubic-bezier(.16,1,.3,1);
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(24px) scale(.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    /* Avatar */
    .avatar-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(34,197,94,.2) 0%, rgba(34,197,94,.08) 100%);
      border: 1.5px solid rgba(34,197,94,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin-bottom: 14px;
      box-shadow: 0 0 24px rgba(34,197,94,.15);
    }
    .system-name {
      font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em;
      text-align: center; line-height: 1.2;
    }
    .system-name .dot { color: var(--primary); }
    .system-sub { font-size: .75rem; color: var(--muted); margin-top: 4px; text-align: center; }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: .72rem; font-weight: 600;
      color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase;
    }
    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border .15s, box-shadow .15s, background .15s;
    }
    .form-input:focus {
      border-color: var(--primary);
      background: rgba(34,197,94,.06);
      box-shadow: 0 0 0 3px var(--input-focus);
    }
    .form-input::placeholder { color: rgba(255,255,255,.2); }

    .pass-wrap { position: relative; }
    .pass-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: .85rem;
      color: var(--muted); padding: 4px; line-height: 1;
    }
    .pass-toggle:hover { color: var(--text); }

    /* Error */
    .error-box {
      background: var(--error-bg);
      border: 1px solid rgba(220,38,38,.25);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: .8rem;
      color: var(--error);
      margin-bottom: 14px;
      display: none;
      animation: shake .3s ease;
    }
    .error-box.show { display: block; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }

    /* Submit */
    .btn-login {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 4px 20px rgba(34,197,94,.25);
      letter-spacing: .01em;
    }
    .btn-login:hover { background: var(--primary-d); box-shadow: 0 6px 24px rgba(34,197,94,.35); }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .5; cursor: wait; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hint */
    .hint {
      margin-top: 20px; text-align: center; font-size: .72rem; color: var(--muted);
      padding-top: 16px; border-top: 1px solid var(--border);
    }

    /* Bottom bar */
    .bottombar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      padding: 10px;
      font-size: .7rem; color: rgba(255,255,255,.2);
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Üst bar -->
  <div class="menubar">
    <div class="menubar-logo">Decco<span class="dot">●</span>OS</div>
    <div class="menubar-clock" id="clock"></div>
  </div>

  <!-- Login -->
  <div class="screen">
    <div class="login-card">
      <div class="avatar-wrap">
        <div class="avatar">🔐</div>
        <div class="system-name">Decco<span class="dot">●</span>OS</div>
        <div class="system-sub">Üretim Yönetim Sistemi</div>
      </div>

      <div class="error-box" id="error-box">⚠ <span id="error-msg"></span></div>

      <form id="login-form" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label">Kullanıcı Adı</label>
          <input id="username" class="form-input" type="text" placeholder="kullanici.adi"
            autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Şifre</label>
          <div class="pass-wrap">
            <input id="password" class="form-input" type="password" placeholder="••••••••"
              autocomplete="current-password" />
            <button type="button" class="pass-toggle" id="pass-eye" onclick="togglePass()">👁</button>
          </div>
        </div>
        <button class="btn-login" type="submit" id="login-btn">Sisteme Giriş Yap</button>
      </form>

      <div class="hint">
        Varsayılan: <code style="opacity:.6">admin</code> / <code style="opacity:.6">decco123</code>
      </div>
    </div>
  </div>

  <!-- Alt bar -->
  <div class="bottombar">Decco Deri — Tüm hakları saklıdır © 2026</div>

<script>
  // Saat
  function updateClock() {
    const now = new Date()
    document.getElementById('clock').textContent = now.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
  }
  updateClock(); setInterval(updateClock, 1000)

  // Zaten giriş yapılmışsa yönlendir
  if (localStorage.getItem('decco_token')) {
    window.location.href = '/dashboard.html'
  }

  function togglePass() {
    const inp = document.getElementById('password')
    const eye = document.getElementById('pass-eye')
    if (inp.type === 'password') { inp.type = 'text'; eye.textContent = '🙈' }
    else { inp.type = 'password'; eye.textContent = '👁' }
  }

  function showError(msg) {
    const box = document.getElementById('error-box')
    document.getElementById('error-msg').textContent = msg
    box.classList.add('show')
    box.classList.remove('show')
    void box.offsetWidth // reflow for animation re-trigger
    box.classList.add('show')
  }

  async function doLogin(e) {
    e.preventDefault()
    const username = document.getElementById('username').value.trim()
    const password = document.getElementById('password').value
    const btn = document.getElementById('login-btn')

    if (!username || !password) { showError('Kullanıcı adı ve şifre gerekli'); return }

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span>Giriş yapılıyor...'

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      })
      const data = await res.json()

      if (!res.ok) {
        showError(data.error || 'Giriş başarısız')
        btn.disabled = false
        btn.innerHTML = 'Sisteme Giriş Yap'
        return
      }

      localStorage.setItem('decco_token', data.token)
      localStorage.setItem('decco_user', JSON.stringify(data.user))

      // Başarılı animasyon
      btn.innerHTML = '✓ Hoş geldiniz, ' + data.user.full_name
      btn.style.background = '#16a34a'
      setTimeout(() => { window.location.href = '/dashboard.html' }, 600)
    } catch {
      showError('Sunucuya bağlanılamadı')
      btn.disabled = false
      btn.innerHTML = 'Sisteme Giriş Yap'
    }
  }

  // Enter key
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus()
  })
</script>
</body>
</html>
