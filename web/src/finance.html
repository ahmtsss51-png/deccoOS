<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Finans — Decco OS</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">Decco<span class="logo-dot">●</span>OS<span>Üretim Yönetim Sistemi</span></div>
  <div class="nav"></div>
  <div class="sidebar-footer">Decco Deri © 2026</div>
</nav>

<main class="main">
  <div class="page-header">
    <div><h1>Finans</h1></div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="openTransfer()">↔ Transfer</button>
      <button class="btn btn-secondary" onclick="openExpense()">+ Gider Ekle</button>
      <button class="btn btn-primary" onclick="openCollection()">💰 Tahsilat Al</button>
    </div>
  </div>

  <!-- KPI Özet -->
  <div class="card-grid grid-4" style="margin-bottom:20px">
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:var(--green-bg)">💵</div>
      <div class="kpi-label">Toplam Kasa / Banka</div>
      <div class="kpi-value sm" id="val-cash">—</div>
      <div class="kpi-sub">kullanılabilir</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:var(--blue-bg)">📥</div>
      <div class="kpi-label">Müşteri Alacağı</div>
      <div class="kpi-value sm" id="val-recv">—</div>
      <div class="kpi-sub">tahsil edilmedi</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:var(--red-bg)">📤</div>
      <div class="kpi-label">Tedarikçi Borcu</div>
      <div class="kpi-value sm" id="val-payable">—</div>
      <div class="kpi-sub">ödenecek</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:var(--yellow-bg)">📊</div>
      <div class="kpi-label">Bu Ay Net</div>
      <div class="kpi-value sm" id="val-net">—</div>
      <div class="kpi-sub" id="sub-net">gelir - gider</div>
    </div>
  </div>

  <!-- Hesap Kartları -->
  <div class="section-title">Hesaplar</div>
  <div class="card-grid grid-3" id="accounts-grid" style="margin-bottom:20px">
    <div class="card" style="color:var(--text-secondary);font-size:.85rem;padding:24px;text-align:center">Yükleniyor...</div>
  </div>

  <!-- Hareketler -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="section-title" style="margin:0">Para Hareketleri</div>
      <select id="acc-filter" class="form-control" style="width:180px;padding:5px 8px" onchange="loadTransactions()">
        <option value="">Tüm hesaplar</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Tarih</th><th>Açıklama</th><th>Tür</th><th>Hesap</th><th style="text-align:right">Tutar</th></tr>
        </thead>
        <tbody id="txn-body">
          <tr><td colspan="5" class="td-muted" style="text-align:center;padding:24px">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div id="toast-container"></div>

<script type="module">
import { api, money, toast, openModal, closeModal, renderSidebar, fmtDate } from '/js/shared.js'
renderSidebar('finance')

let accounts = []
const txnTypeLabel = {
  customer_payment:'Müşteri Tahsilatı', supplier_payment:'Tedarikçi Ödemesi',
  expense:'Gider', asset_purchase:'Demirbaş Alımı',
  founder_funding:'Kurucu Finansmanı', founder_repayment:'Kurucuya Geri Ödeme',
  transfer_in:'Transfer Girişi', transfer_out:'Transfer Çıkışı'
}

async function loadSummary() {
  const f = await api('/finance/summary')
  document.getElementById('val-cash').textContent = money(f.available_cash)
  document.getElementById('val-recv').textContent = money(f.customer_receivable)
  // CHK-A06: Açılış doğrulanmadan gerçek borç bilinmez
  document.getElementById('val-payable').textContent = f.opening_locked ? money(f.supplier_payable) : '— Doğrulanmadı'
  if (!f.opening_locked) document.getElementById('val-payable').style.color = 'var(--text-secondary)'
  const net = parseFloat(f.this_month_income||0) - parseFloat(f.this_month_expense||0)
  const netEl = document.getElementById('val-net')
  netEl.textContent = money(net)
  netEl.className = `kpi-value sm ${net>=0?'money-pos':'money-neg'}`
  document.getElementById('sub-net').textContent = `+${money(f.this_month_income)} / -${money(f.this_month_expense)}`
}

async function loadAccounts() {
  accounts = await api('/finance/accounts')
  const grid = document.getElementById('accounts-grid')
  const sel = document.getElementById('acc-filter')
  sel.innerHTML = `<option value="">Tüm hesaplar</option>` +
    accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')

  if (!accounts.length) {
    grid.innerHTML = `<div class="card" style="color:var(--text-secondary);text-align:center;padding:24px">Henüz hesap tanımlanmamış</div>
      <div style="display:flex;align-items:center"><button class="btn btn-primary" onclick="openNewAccount()">+ Yeni Hesap</button></div>`
    return
  }

  grid.innerHTML = accounts.map(a => `
    <div class="card kpi-card" onclick="document.getElementById('acc-filter').value='${a.id}';loadTransactions()" style="cursor:pointer">
      <div class="kpi-label">${a.name}</div>
      <div class="kpi-value sm">${money(a.balance)}</div>
      <div class="kpi-sub">${a.account_type==='cash'?'Nakit':a.account_type==='bank'?'Banka':a.account_type==='card'?'Kart / Sağlayıcı':'Diğer'}</div>
    </div>
  `).join('') + `<div class="card" style="display:flex;align-items:center;justify-content:center">
    <button class="btn btn-secondary" onclick="openNewAccount()">+ Yeni Hesap</button>
  </div>`
}

async function loadTransactions() {
  const accId = document.getElementById('acc-filter').value
  const data = await api(`/finance/transactions${accId?'?account_id='+accId:''}`)
  const body = document.getElementById('txn-body')
  if (!data.length) {
    body.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">💳</div><div>Hareket bulunamadı</div></div></td></tr>`
    return
  }
  body.innerHTML = data.map(t => `<tr>
    <td class="td-muted">${fmtDate(t.transaction_date)}</td>
    <td>${t.description||txnTypeLabel[t.transaction_type]||t.transaction_type}</td>
    <td>${txnTypeLabel[t.transaction_type]||t.transaction_type}</td>
    <td class="td-muted">${t.account_name}</td>
    <td class="td-mono td-bold" style="text-align:right;${parseFloat(t.amount)>0?'color:var(--green)':'color:var(--red)'}">
      ${parseFloat(t.amount)>0?'+':''}${money(t.amount)}
    </td>
  </tr>`).join('')
}

// CHK-F04: Kontrollü gider kategorileri
const EXPENSE_CATS = ['Reklam','Kargo','Ambalaj','Kira','Elektrik/İnternet','Sarf Malzeme',
  'Bakım/Onarım','Yazılım/Hizmet','Banka/Komisyon','Diğer']

window.openExpense = () => {
  const today = new Date().toISOString().slice(0,10)
  openModal(`
    <div class="modal-header"><h3>Gider Ekle</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Tutar *</label><input id="exp-amount" class="form-control" type="number" placeholder="0" /></div>
        <div class="form-group"><label class="form-label">Hesap *</label>
          <select id="exp-account" class="form-control">
            ${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Kategori *</label>
          <select id="exp-cat" class="form-control">
            ${EXPENSE_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label class="form-label">İşlem Tarihi *</label>
          <input id="exp-date" class="form-control" type="date" value="${today}" />
        </div>
      </div>
      <div class="form-group"><label class="form-label">Açıklama</label>
        <input id="exp-desc" class="form-control" placeholder="Kargo firması, fatura no..." />
      </div>
      <div class="op-note" style="font-size:.76rem;margin-top:8px">
        ⚠️ Demirbaş/ekipman alımları bu ekrandan girilmez — Açılış modülünü kullanın.
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="saveExpense()">Kaydet</button>
    </div>
  `)
}

window.saveExpense = async () => {
  const amount = parseFloat(document.getElementById('exp-amount').value)
  const account_id = document.getElementById('exp-account').value
  const category = document.getElementById('exp-cat').value
  const transaction_date = document.getElementById('exp-date').value
  const description = document.getElementById('exp-desc').value
  if (!amount||amount<=0) { toast('Geçerli tutar girin','error'); return }
  if (!transaction_date) { toast('İşlem tarihi zorunludur','error'); return }
  try {
    await api('/finance/transactions',{method:'POST',body:{account_id,amount:-amount,transaction_type:'expense',description,category,transaction_date}})
    toast('Gider kaydedildi')
    closeModal()
    loadSummary(); loadTransactions()
  } catch(e) { toast(e.message,'error') }
}

window.openTransfer = () => {
  openModal(`
    <div class="modal-header"><h3>Hesaplar Arası Transfer</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Kaynak Hesap</label>
          <select id="tr-from" class="form-control">${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label class="form-label">Hedef Hesap</label>
          <select id="tr-to" class="form-control">${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Tutar *</label>
        <input id="tr-amount" class="form-control" type="number" placeholder="0" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="saveTransfer()">Transfer Yap</button>
    </div>
  `)
}

window.saveTransfer = async () => {
  const from_account_id = document.getElementById('tr-from').value
  const to_account_id = document.getElementById('tr-to').value
  const amount = parseFloat(document.getElementById('tr-amount').value)
  if (from_account_id === to_account_id) { toast('Aynı hesap seçilemez','error'); return }
  if (!amount||amount<=0) { toast('Geçerli tutar girin','error'); return }
  try {
    await api('/finance/transfer',{method:'POST',body:{from_account_id,to_account_id,amount}})
    toast('Transfer yapıldı')
    closeModal()
    loadSummary(); loadAccounts(); loadTransactions()
  } catch(e) { toast(e.message,'error') }
}

window.openNewAccount = () => {
  openModal(`
    <div class="modal-header"><h3>Yeni Hesap</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Hesap Adı *</label><input id="na-name" class="form-control" placeholder="Nakit, İş Bankası..." /></div>
      <div class="form-group"><label class="form-label">Tür</label>
        <select id="na-type" class="form-control">
          <option value="cash">Nakit</option><option value="bank">Banka</option>
          <option value="card">Kart / Sağlayıcı</option><option value="founder">Kurucu</option>
        </select>
      </div>
      <div class="op-note" style="margin-top:12px;font-size:.78rem">
        Açılış bakiyesi <strong>Açılış → Kasa / Banka</strong> bölümünden girilir. Go-live sonrası hesaplar sıfır bakiyeyle oluşur.
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="saveAccount()">Kaydet</button>
    </div>
  `)
}

window.saveAccount = async () => {
  const name = document.getElementById('na-name').value.trim()
  const account_type = document.getElementById('na-type').value
  if (!name) { toast('Hesap adı zorunludur','error'); return }
  try {
    await api('/finance/accounts',{method:'POST',body:{name,account_type}})
    toast('Hesap oluşturuldu')
    closeModal()
    loadAccounts()
  } catch(e) { toast(e.message,'error') }
}

window.loadTransactions = loadTransactions
window.closeModal = closeModal

// ── Tahsilat Al ─────────────────────────────────────────────────────────────
window.openCollection = async () => {
  let receivables = []
  try { receivables = await api('/finance/receivables') } catch (e) { toast(e.message, 'error'); return }
  if (!receivables.length) { toast('Tüm alacaklar tahsil edilmiş', 'error'); return }

  openModal(`
    <div class="modal-header"><h3>Müşteriden Tahsilat Al</h3>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Müşteri *</label>
        <select id="col-cust" class="form-control" onchange="onCollectionCustomerChange()">
          <option value="">— Seçin —</option>
          ${receivables.map(r => `<option value="${r.customer_id}" data-balance="${r.open_balance}">${r.customer_name} — Açık: ${money(r.open_balance)}</option>`).join('')}
        </select>
      </div>
      <div id="col-orders" style="display:none;margin-bottom:14px">
        <div class="section-title" style="margin-bottom:8px">Sipariş Dağıtımı (FIFO)</div>
        <div id="col-orders-table"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Toplam Tutar *</label>
          <input id="col-amount" class="form-control" type="number" step="0.01" placeholder="0.00"
            oninput="onCollectionAmountChange()" /></div>
        <div class="form-group"><label class="form-label">Hesap *</label>
          <select id="col-account" class="form-control">
            ${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Tarih</label>
        <div class="form-group"><label class="form-label">Tarih</label>
          <input id="col-date" class="form-control" type="date" value="${new Date().toISOString().slice(0,10)}" /></div>
      </div>
      <div class="form-group"><label class="form-label">Açıklama</label>
        <input id="col-desc" class="form-control" placeholder="Opsiyonel not..." /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="saveCollection()">Tahsilatı Kaydet</button>
    </div>`, 'modal-lg')

  window.__receivables = receivables

  window.onCollectionCustomerChange = () => {
    const sel = document.getElementById('col-cust')
    const custId = parseInt(sel.value)
    const rec = window.__receivables.find(r => r.customer_id === custId)
    if (!rec) { document.getElementById('col-orders').style.display = 'none'; return }
    document.getElementById('col-orders').style.display = 'block'
    renderCollectionOrders(rec.orders, parseFloat(document.getElementById('col-amount').value || 0))
  }

  window.onCollectionAmountChange = () => {
    const custId = parseInt(document.getElementById('col-cust').value)
    const rec = window.__receivables.find(r => r.customer_id === custId)
    if (!rec) return
    const amt = parseFloat(document.getElementById('col-amount').value || 0)
    renderCollectionOrders(rec.orders, amt)
  }
}

function renderCollectionOrders(orders, totalAmt) {
  let remaining = totalAmt
  const rows = orders.map(o => {
    const open = parseFloat(o.open_amount)
    const applying = Math.min(remaining, open)
    remaining -= applying
    const bar = open > 0 ? Math.round((applying / open) * 100) : 0
    return `<tr>
      <td class="td-mono td-bold">${o.order_no || '#' + o.id}</td>
      <td class="td-muted">${fmtDate(o.order_date)}</td>
      <td class="td-mono">${money(o.open_amount)}</td>
      <td class="td-mono ${applying > 0 ? 'money-pos' : ''}">${applying > 0 ? money(applying) : '—'}</td>
      <td><div style="background:var(--border);border-radius:4px;height:6px;width:80px">
        <div style="background:var(--green);height:6px;border-radius:4px;width:${bar}%"></div></div></td>
    </tr>`
  })
  document.getElementById('col-orders-table').innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Sipariş</th><th>Tarih</th><th>Açık</th><th>Uygulanacak</th><th></th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>`
}

window.saveCollection = async () => {
  const customer_id = parseInt(document.getElementById('col-cust').value)
  const account_id = document.getElementById('col-account').value
  const amount = parseFloat(document.getElementById('col-amount').value)
  // CHK-F02: method seçilen hesabın account_type'ından türer
  const selAcc = accounts.find(a => String(a.id) === String(account_id))
  const method = selAcc?.account_type === 'bank' ? 'bank' : selAcc?.account_type === 'card' ? 'card' : 'cash'
  const paid_at = document.getElementById('col-date').value
  const description = document.getElementById('col-desc').value || null
  if (!customer_id) { toast('Müşteri seçin', 'error'); return }
  if (!amount || amount <= 0) { toast('Geçerli tutar girin', 'error'); return }
  try {
    await api('/finance/collections', { method: 'POST', body: { customer_id, account_id, amount, method, paid_at, description } })
    toast('Tahsilat kaydedildi ✓')
    closeModal()
    Promise.all([loadSummary(), loadAccounts(), loadTransactions()])
  } catch (e) { toast(e.message, 'error') }
}

Promise.all([loadSummary(), loadAccounts(), loadTransactions()])
</script>
</body>
</html>
