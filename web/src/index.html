<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decco OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; }
    .splash {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 12px;
    }
    .splash h1 { font-size: 2rem; font-weight: 700; }
    .splash p { color: #666; }
    .badge { background: #16a34a; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="splash">
    <h1>Decco OS</h1>
    <p>Sistem yükleniyor...</p>
    <span id="status" class="badge">Bağlanıyor</span>
  </div>
  <script>
    fetch('/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('status').textContent = d.status === 'ok' ? 'Sistem hazır' : 'Hata'
        document.getElementById('status').style.background = d.status === 'ok' ? '#16a34a' : '#dc2626'
        if (d.status === 'ok') setTimeout(() => window.location.href = '/dashboard.html', 800)
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Sunucuya ulaşılamıyor'
        document.getElementById('status').style.background = '#dc2626'
      })
  </script>
</body>
</html>
