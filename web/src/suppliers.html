<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tedarikçiler — Decco OS</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">Decco<span class="logo-dot">●</span>OS<span>Üretim Yönetim Sistemi</span></div>
  <div class="nav"></div>
  <div class="sidebar-footer">Decco Deri © 2026</div>
</nav>

<main class="main">
  <div class="page-header">
    <div><h1>Tedarikçiler</h1></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="openSupplierForm()">+ Yeni Tedarikçi</button>
    </div>
  </div>

  <div class="search-bar" style="margin-bottom:12px">
    <span>🔍</span>
    <input id="search" type="text" placeholder="Tedarikçi adı ara..." oninput="filterSuppliers()" />
  </div>

  <!-- KPI -->
  <div class="card-grid grid-3" style="margin-bottom:16px">
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:var(--blue-bg)">🏭</div>
      <div class="kpi-label">Toplam Tedarikçi</div>
      <div class="kpi-value" id="kpi-total">—</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:var(--red-bg)">💸</div>
      <div class="kpi-label">Toplam Borç</div>
      <div class="kpi-value sm" id="kpi-debt">—</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:var(--yellow-bg)">📦</div>
      <div class="kpi-label">Borçlu Tedarikçi</div>
      <div class="kpi-value" id="kpi-owed">—</div>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Tedarikçi</th><th>Telefon</th><th>Toplam Borç</th><th>Son Alım</th><th></th></tr>
        </thead>
        <tbody id="suppliers-body">
          <tr><td colspan="5" class="td-muted" style="text-align:center;padding:32px">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div id="toast-container"></div>

<script type="module">
import { api, money, toast, openModal, closeModal, renderSidebar, fmtDate } from '/js/shared.js'
renderSidebar('suppliers')

let allSuppliers = []

async function load() {
  allSuppliers = await api('/suppliers')
  render(allSuppliers)

  // KPIs
  document.getElementById('kpi-total').textContent = allSuppliers.length
  const totalDebt = allSuppliers.reduce((s, x) => s + parseFloat(x.total_debt || 0), 0)
  document.getElementById('kpi-debt').textContent = money(totalDebt)
  document.getElementById('kpi-owed').textContent = allSuppliers.filter(s => parseFloat(s.total_debt) > 0).length
}

function render(data) {
  const body = document.getElementById('suppliers-body')
  if (!data.length) {
    body.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">🏭</div><div>Tedarikçi bulunamadı</div></div></td></tr>`
    return
  }
  body.innerHTML = data.map(s => `<tr onclick="openSupplierDetail(${s.id})" style="cursor:pointer">
    <td class="td-bold">${s.name}</td>
    <td class="td-muted">${s.phone || '—'}</td>
    <td class="td-mono ${parseFloat(s.total_debt) > 0 ? 'money-neg' : ''}">${parseFloat(s.total_debt) > 0 ? money(s.total_debt) : '—'}</td>
    <td class="td-muted">${fmtDate(s.created_at)}</td>
    <td><button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openSupplierForm(${s.id})">Düzenle</button></td>
  </tr>`).join('')
}

window.filterSuppliers = () => {
  const q = document.getElementById('search').value.toLowerCase()
  render(allSuppliers.filter(s => s.name.toLowerCase().includes(q)))
}

window.openSupplierDetail = async (id) => {
  const s = allSuppliers.find(x => x.id === id)
  if (!s) return
  let purchasesHtml = '<div class="td-muted" style="padding:12px">Alım geçmişi yükleniyor...</div>'

  openModal(`
    <div class="modal-header"><h3>${s.name}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-row" style="margin-bottom:14px">
        <div><div class="kpi-label">Telefon</div><div>${s.phone || '—'}</div></div>
        <div><div class="kpi-label">Toplam Borç</div><div class="td-bold ${parseFloat(s.total_debt) > 0 ? 'money-neg' : ''}">${parseFloat(s.total_debt) > 0 ? money(s.total_debt) : 'Borç yok'}</div></div>
      </div>
      ${s.notes ? `<div class="form-group"><div class="kpi-label">Notlar</div><div>${s.notes}</div></div>` : ''}
      <div class="section-title" style="margin-bottom:8px">Alım Geçmişi</div>
      <div id="purchases-detail">${purchasesHtml}</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" onclick="openPurchaseForm(${id})">+ Yeni Alım</button>
      <button class="btn btn-secondary" onclick="closeModal()">Kapat</button>
    </div>
  `, 'modal-lg')

  // Alımları yükle
  try {
    const purchases = await api(`/suppliers/${id}/purchases`)
    const el = document.getElementById('purchases-detail')
    if (!el) return
    el.innerHTML = purchases.length
      ? `<div class="table-wrap"><table>
          <thead><tr><th>Tarih</th><th>Toplam</th><th>Ödenen</th><th>Kalan</th></tr></thead>
          <tbody>${purchases.map(p => {
            const kalan = parseFloat(p.total_amount||0) - parseFloat(p.paid_amount||0)
            return `<tr><td class="td-muted">${fmtDate(p.created_at)}</td><td class="td-mono">${money(p.total_amount)}</td><td class="td-mono">${money(p.paid_amount)}</td><td class="td-mono ${kalan>0?'money-neg':''}">${kalan>0?money(kalan):'✓'}</td></tr>`
          }).join('')}</tbody>
        </table></div>`
      : '<div class="td-muted" style="padding:12px">Henüz alım kaydı yok.</div>'
  } catch {}
}

window.openSupplierForm = async (id = null) => {
  let s = {}
  if (id) s = allSuppliers.find(x => x.id === id) || {}
  openModal(`
    <div class="modal-header"><h3>${id ? 'Tedarikçi Düzenle' : 'Yeni Tedarikçi'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Tedarikçi Adı *</label>
        <input id="s-name" class="form-control" value="${s.name||''}" placeholder="Deri Pazarı A.Ş." /></div>
      <div class="form-group"><label class="form-label">Telefon</label>
        <input id="s-phone" class="form-control" value="${s.phone||''}" placeholder="0212 XXX XX XX" /></div>
      <div class="form-group"><label class="form-label">Notlar</label>
        <textarea id="s-notes" class="form-control" rows="2">${s.notes||''}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="saveSupplier(${id||'null'})">Kaydet</button>
    </div>
  `)
}

window.saveSupplier = async (id) => {
  const body = {
    name: document.getElementById('s-name').value.trim(),
    phone: document.getElementById('s-phone').value || null,
    notes: document.getElementById('s-notes').value || null,
  }
  if (!body.name) { toast('Ad zorunludur', 'error'); return }
  try {
    if (id) await api(`/suppliers/${id}`, { method: 'PUT', body })
    else await api('/suppliers', { method: 'POST', body })
    toast(id ? 'Tedarikçi güncellendi' : 'Tedarikçi eklendi')
    closeModal(); load()
  } catch (e) { toast(e.message, 'error') }
}

window.openPurchaseForm = async (supplierId) => {
  closeModal()
  const materials = await api('/materials')
  const accounts = await api('/finance/accounts')
  openModal(`
    <div class="modal-header"><h3>Yeni Alım Kaydı</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div id="purchase-lines">
        <div class="form-row" style="margin-bottom:8px">
          <div class="form-group"><label class="form-label">Malzeme</label>
            <select class="form-control pl-mat"><option value="">Seçin...</option>${materials.map(m=>`<option value="${m.id}">${m.sku} — ${m.name}</option>`).join('')}</select>
          </div>
          <div class="form-group"><label class="form-label">Miktar</label><input class="form-control pl-qty" type="number" step="0.01" placeholder="0"/></div>
          <div class="form-group"><label class="form-label">Birim Fiyat (₺)</label><input class="form-control pl-price" type="number" step="0.01" placeholder="0"/></div>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="addPurchaseLine()">+ Satır Ekle</button>
      <hr style="margin:14px 0;border-color:var(--border)"/>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Ödeme Hesabı</label>
          <select id="pur-acc" class="form-control"><option value="">Ödeme Yapılmadı</option>${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label class="form-label">Ödenen Tutar (₺)</label>
          <input id="pur-paid" class="form-control" type="number" step="0.01" value="0"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="savePurchase(${supplierId})">Alımı Kaydet</button>
    </div>
  `, 'modal-lg')

  window.addPurchaseLine = () => {
    const div = document.createElement('div')
    div.className = 'form-row'
    div.style.marginBottom = '8px'
    div.innerHTML = `
      <div class="form-group"><select class="form-control pl-mat"><option value="">Seçin...</option>${materials.map(m=>`<option value="${m.id}">${m.sku} — ${m.name}</option>`).join('')}</select></div>
      <div class="form-group"><input class="form-control pl-qty" type="number" step="0.01" placeholder="0"/></div>
      <div class="form-group"><input class="form-control pl-price" type="number" step="0.01" placeholder="0"/></div>`
    document.getElementById('purchase-lines').appendChild(div)
  }
}

window.savePurchase = async (supplierId) => {
  const mats = document.querySelectorAll('.pl-mat')
  const qtys = document.querySelectorAll('.pl-qty')
  const prices = document.querySelectorAll('.pl-price')
  const lines = []
  let total = 0
  mats.forEach((m, i) => {
    if (!m.value) return
    const qty = parseFloat(qtys[i]?.value) || 0
    const price = parseFloat(prices[i]?.value) || 0
    lines.push({ material_id: parseInt(m.value), quantity: qty, unit_cost: price })
    total += qty * price
  })
  if (!lines.length) { toast('En az 1 malzeme girin', 'error'); return }
  const paid = parseFloat(document.getElementById('pur-paid').value) || 0
  const account_id = document.getElementById('pur-acc').value || null
  try {
    await api('/suppliers/purchases', { method: 'POST', body: { supplier_id: supplierId, lines, paid_amount: paid, account_id } })
    toast('Alım kaydedildi ✓')
    closeModal(); load()
  } catch (e) { toast(e.message, 'error') }
}

window.closeModal = closeModal
load()
</script>
</body>
</html>
