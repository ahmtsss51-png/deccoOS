<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Müşteriler — Decco OS</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">Decco<span class="logo-dot">●</span>OS<span>Üretim Yönetim Sistemi</span></div>
  <div class="nav"></div>
  <div class="sidebar-footer">Decco Deri © 2026</div>
</nav>

<main class="main">
  <div class="page-header">
    <div><h1>Müşteriler</h1></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="openNewCustomer()">+ Yeni Müşteri</button>
    </div>
  </div>

  <div class="search-bar">
    <span>🔍</span>
    <input id="search" type="text" placeholder="Ad veya telefon ile ara..." oninput="filterCustomers()" />
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Müşteri</th><th>Telefon</th><th>Şehir</th><th>Kanal</th>
            <th>Sipariş</th><th>Ödenen</th><th>Açık Bakiye</th><th>Son Sipariş</th><th></th>
          </tr>
        </thead>
        <tbody id="customers-body">
          <tr><td colspan="9" class="td-muted" style="text-align:center;padding:32px">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Müşteri Detay Modal -->
<div id="toast-container"></div>

<script type="module">
import { api, money, chip, toast, openModal, closeModal, renderSidebar, fmtDate } from '/js/shared.js'
renderSidebar('customers')

let allCustomers = []

const channelLabel = { whatsapp:'WhatsApp', instagram:'Instagram', web:'Web', direct:'Yüz yüze' }
const channelChip = c => c ? `<span class="chip chip-blue">${channelLabel[c]||c}</span>` : '—'

async function load() {
  allCustomers = await api('/customers')
  render(allCustomers)
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, ch =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]))

function render(data) {
  const body = document.getElementById('customers-body')
  if (!data.length) {
    body.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">👤</div><div>Müşteri bulunamadı</div><p>Yeni müşteri ekleyerek başlayın.</p></div></td></tr>`
    return
  }
  body.innerHTML = data.map(c => {
    const bakiye = parseFloat(c.total_ordered||0) - parseFloat(c.total_paid||0)
    return `<tr onclick="location.href='/customer-detail.html?id=${c.id}'">
      <td class="td-bold">${esc(c.name)}</td>
      <td>${esc(c.phone)||'—'}</td>
      <td class="td-muted">${esc(c.city)||'—'}</td>
      <td>${channelChip(c.channel)}</td>
      <td class="td-mono">${c.order_count||0}</td>
      <td class="td-mono">${money(c.total_paid)}</td>
      <td class="td-mono ${bakiye>0?'money-neg':''}">${bakiye>0?money(bakiye):'✓'}</td>
      <td class="td-muted">${fmtDate(c.last_order_date)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openEditCustomer(${c.id})">Düzenle</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();confirmDelete(${c.id})">Sil</button>
      </td>
    </tr>`
  }).join('')
}

window.confirmDelete = (id) => {
  const c = allCustomers.find(x => x.id === id) || {}
  const bakiye = parseFloat(c.total_ordered||0) - parseFloat(c.total_paid||0)
  openModal(`
    <div class="modal-header"><h3>Müşteriyi Sil</h3>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:.87rem;line-height:1.6;margin:0">
        <b>${esc(c.name)}</b> silinecek.
        ${parseInt(c.order_count||0) > 0
          ? `Bu müşterinin <b>${c.order_count} siparişi</b> var; kayıt arşivlenir,
             sipariş geçmişi ve ciro raporları korunur.`
          : 'Hiç siparişi yok, kayıt tamamen silinecek.'}
      </p>
      ${bakiye > 0 ? `<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:8px;padding:10px 14px;font-size:.82rem;margin-top:12px">
        ⚠️ <b>${money(bakiye)}</b> açık alacağı var — silme reddedilecek.</div>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Vazgeç</button>
      <button class="btn btn-danger" onclick="doDelete(${id})">Evet, Sil</button>
    </div>`)
}

window.doDelete = async (id) => {
  try {
    const r = await api(`/customers/${id}`, { method: 'DELETE' })
    closeModal()
    toast(r.hard_deleted ? 'Müşteri silindi' : 'Müşteri arşivlendi')
    load()
  } catch (e) { toast(e.message, 'error') }
}

window.filterCustomers = () => {
  const q = document.getElementById('search').value.toLowerCase()
  render(allCustomers.filter(c => c.name.toLowerCase().includes(q) || (c.phone||'').includes(q)))
}

window.openNewCustomer = () => customerForm()
window.openEditCustomer = async (id) => {
  const c = await api(`/customers/${id}`)
  customerForm(c)
}

function customerForm(c = null) {
  openModal(`
    <div class="modal-header">
      <h3>${c ? 'Müşteri Düzenle' : 'Yeni Müşteri'}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Ad Soyad *</label>
        <input id="f-name" class="form-control" value="${esc(c?.name)}" placeholder="Müşteri adı" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Telefon</label>
          <input id="f-phone" class="form-control" value="${esc(c?.phone)}" placeholder="05XX XXX XX XX" />
        </div>
        <div class="form-group">
          <label class="form-label">Kanal</label>
          <select id="f-channel" class="form-control">
            <option value="">Seçin</option>
            ${['whatsapp','instagram','web','direct'].map(k=>`<option value="${k}" ${c?.channel===k?'selected':''}>${channelLabel[k]}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">E-posta</label>
          <input id="f-email" class="form-control" value="${esc(c?.email)}" placeholder="ornek@mail.com" />
        </div>
        <div class="form-group">
          <label class="form-label">İl</label>
          <input id="f-city" class="form-control" value="${esc(c?.city)}" placeholder="İstanbul" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">İlçe</label>
          <input id="f-district" class="form-control" value="${esc(c?.district)}" placeholder="Kadıköy" />
        </div>
        <div class="form-group">
          <label class="form-label">Adres</label>
          <input id="f-address" class="form-control" value="${esc(c?.address)}" placeholder="Mahalle, cadde, no..." />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notlar</label>
        <textarea id="f-notes" class="form-control" rows="2" placeholder="Özel notlar...">${esc(c?.notes)}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="saveCustomer(${c?.id||'null'})">Kaydet</button>
    </div>
  `)
}

window.saveCustomer = async (id) => {
  const g = f => document.getElementById(f).value.trim() || null
  const body = {
    name: document.getElementById('f-name').value.trim(),
    phone: g('f-phone'), channel: document.getElementById('f-channel').value || null,
    email: g('f-email'), city: g('f-city'), district: g('f-district'),
    address: g('f-address'), notes: g('f-notes'),
  }
  if (!body.name) { toast('Ad zorunludur', 'error'); return }
  try {
    if (id) await api(`/customers/${id}`, { method:'PUT', body })
    else await api('/customers', { method:'POST', body })
    toast(id ? 'Müşteri güncellendi' : 'Müşteri eklendi')
    closeModal()
    load()
  } catch(e) { toast(e.message, 'error') }
}

// Global erişim
window.closeModal = closeModal
load()
</script>
</body>
</html>
