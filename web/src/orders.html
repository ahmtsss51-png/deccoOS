<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Siparişler — Decco OS</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">Decco<span class="logo-dot">●</span>OS<span>Üretim Yönetim Sistemi</span></div>
  <div class="nav"></div>
  <div class="sidebar-footer">Decco Deri © 2026</div>
</nav>

<main class="main">
  <div class="page-header">
    <div><h1>Siparişler</h1></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="openNewOrder()">+ Yeni Sipariş</button>
    </div>
  </div>

  <!-- Ay şeridi -->
  <div class="filter-tabs" id="month-tabs" style="margin-bottom:8px;overflow-x:auto"></div>

  <!-- CHK-O05: Operasyonel durum filtresi -->
  <div class="filter-tabs" id="filter-tabs" style="margin-bottom:4px">
    <button class="filter-tab active" data-status="">Tümü</button>
    <button class="filter-tab" data-status="production_pending">Üretim Bekliyor</button>
    <button class="filter-tab" data-status="in_production">Üretimde</button>
    <button class="filter-tab" data-status="quality_check">Kalite Kontrol</button>
    <button class="filter-tab" data-status="ready">Hazır</button>
    <button class="filter-tab" data-status="shipped">Kargolandı</button>
    <button class="filter-tab" data-status="completed">Tamamlandı</button>
    <button class="filter-tab" data-status="cancelled">İptal</button>
    <button class="filter-tab" data-status="overdue">⚠️ Geciken</button>
  </div>

  <!-- CHK-O05: Ödeme durumu filtresi -->
  <div class="filter-tabs" id="pay-filter-tabs" style="margin-bottom:8px">
    <span style="font-size:.75rem;color:var(--text-secondary);align-self:center;margin-right:4px">Ödeme:</span>
    <button class="filter-tab active" data-payment="">Tümü</button>
    <button class="filter-tab" data-payment="unpaid">Ödenmedi</button>
    <button class="filter-tab" data-payment="partial">Kısmi</button>
    <button class="filter-tab" data-payment="paid">Ödendi</button>
  </div>

  <div class="search-bar" style="margin-bottom:12px">
    <span>🔍</span>
    <input id="search" type="text" placeholder="Müşteri adı veya sipariş no ara..." />
  </div>

  <div id="month-summary" class="card" style="padding:12px 16px;margin-bottom:12px;display:none"></div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Sipariş</th><th>Müşteri / Ürün</th><th>Tarih</th><th>Toplam</th><th>Kalan</th><th>Durum / Ödeme</th><th></th></tr>
        </thead>
        <tbody id="orders-body">
          <tr><td colspan="8" class="td-muted" style="text-align:center;padding:32px">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div id="toast-container"></div>

<script type="module">
import { api, money, chip, toast, openModal, closeModal, renderSidebar, fmtDate } from '/js/shared.js'
renderSidebar('orders')

let activeStatus = ''
let activePayment = ''    // CHK-O05: ödeme filtresi
let activeMonth = ''      // '' = tüm aylar
let searchQ = ''
let orders = []
let months = []

const MONTH_TR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara']
const monthLabel = m => {
  const [y, mo] = m.split('-')
  return `${MONTH_TR[parseInt(mo,10)-1]} ${y}`
}
const shortMoney = v => {
  const n = parseFloat(v) || 0
  return n >= 1000 ? '₺' + (n/1000).toFixed(1).replace('.0','') + 'K' : money(n)
}

async function loadMonths() {
  months = await api('/orders/months')
  // Varsayılan: içinde bulunulan ay; o ayda kayıt yoksa en yeni dolu ay
  if (activeMonth === null) return
  const now = new Date()
  const cur = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`
  activeMonth = months.some(m => m.month === cur) ? cur : (months[0]?.month || '')
  renderMonths()
}

function renderMonths() {
  document.getElementById('month-tabs').innerHTML =
    `<button class="filter-tab ${activeMonth===''?'active':''}" data-month="">Tümü</button>` +
    months.map(m => `
      <button class="filter-tab ${activeMonth===m.month?'active':''}" data-month="${m.month}"
        style="white-space:nowrap">
        ${monthLabel(m.month)} <span style="opacity:.65">· ${m.order_count} · ${shortMoney(m.revenue)}</span>
      </button>`).join('')

  const box = document.getElementById('month-summary')
  const m = months.find(x => x.month === activeMonth)
  if (m) {
    box.style.display = ''
    box.innerHTML = `<div style="display:flex;gap:24px;flex-wrap:wrap;font-size:.82rem">
      <span class="td-muted">${monthLabel(m.month)}</span>
      <span>Sipariş: <b>${m.order_count}</b></span>
      <span>Ciro: <b>${money(m.revenue)}</b></span>
      <span>Tahsilat: <b class="money-pos">${money(m.collected)}</b></span>
      <span>Açık: <b class="${parseFloat(m.open_amount)>0?'money-neg':'money-pos'}">${money(m.open_amount)}</b></span>
    </div>`
  } else box.style.display = 'none'
}

async function load() {
  const p = new URLSearchParams()
  if (activeStatus && activeStatus !== 'overdue') p.set('status', activeStatus)
  if (activeMonth) p.set('month', activeMonth)
  if (searchQ) p.set('q', searchQ)
  if (activePayment) p.set('payment_status', activePayment)  // CHK-O05
  orders = await api('/orders' + (p.toString() ? '?' + p : ''))
  if (activeStatus === 'overdue') {
    const now = new Date()
    orders = orders.filter(o => o.delivery_date && new Date(o.delivery_date) < now && !['completed','cancelled','shipped'].includes(o.status))
  }
  render()
}

function render() {
  const body = document.getElementById('orders-body')
  if (!orders.length) {
    body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div><div>Sipariş bulunamadı</div></div></td></tr>`
    return
  }
  body.innerHTML = orders.map(o => {
    const kalan = parseFloat(o.total_amount||0) - parseFloat(o.paid_amount||0)
    const isOverdue = o.delivery_date && new Date(o.delivery_date) < new Date() && !['completed','cancelled','shipped'].includes(o.status)

    // CHK-O01/O06: İlk ürün özeti + +N ürün daha
    const extra = parseInt(o.item_count) > 1 ? ` <span class="td-muted">+${parseInt(o.item_count)-1} ürün</span>` : ''
    const itemSummary = (o.first_item_summary || `${o.unit_count} adet`) + extra

    // CHK-O02: Ödeme statüsü ve operasyonel statüs ayrı badge
    const payStatus = kalan <= 0.005
      ? `<span class="chip chip-green" style="font-size:.7rem">Ödendi</span>`
      : parseFloat(o.paid_amount||0) > 0
        ? `<span class="chip chip-yellow" style="font-size:.7rem">Kısmi</span>`
        : `<span class="chip chip-red" style="font-size:.7rem">Ödenmedi</span>`

    // CHK-O03: Ödeme butonu yalnız outstanding > 0 olduğunda
    const payBtn = kalan > 0.005
      ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openPayment(${o.id},${o.total_amount},${o.paid_amount})">Ödeme Al</button>`
      : parseFloat(o.paid_amount||0) > 0
        ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openDetail(${o.id})">Geçmiş</button>`
        : ''

    return `<tr onclick="openDetail(${o.id})" style="${isOverdue?'border-left:3px solid var(--red)':''}">
      <td class="td-bold td-mono">${o.order_no || '#'+o.id}</td>
      <td>${o.customer_name}<br><span class="td-muted" style="font-size:.75rem">${itemSummary}</span></td>
      <td class="td-muted">${fmtDate(o.order_date)}</td>
      <td class="td-mono td-bold">${money(o.total_amount)}</td>
      <td class="td-mono ${kalan>0?'money-neg':'money-pos'}">${kalan>0?money(kalan):'✓ Tamam'}</td>
      <td>${chip(o.status)}<br>${payStatus}</td>
      <td>${payBtn}</td>
    </tr>`
  }).join('')
}

// Ay şeridi
document.getElementById('month-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab')
  if (!tab) return
  activeMonth = tab.dataset.month
  renderMonths()
  load()
})

// Durum sekmeleri
document.getElementById('filter-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab')
  if (!tab) return
  document.querySelectorAll('#filter-tabs .filter-tab').forEach(t => t.classList.remove('active'))
  tab.classList.add('active')
  activeStatus = tab.dataset.status
  load()
})

// CHK-O05: Ödeme filtresi
document.getElementById('pay-filter-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab')
  if (!tab) return
  document.querySelectorAll('#pay-filter-tabs .filter-tab').forEach(t => t.classList.remove('active'))
  tab.classList.add('active')
  activePayment = tab.dataset.payment
  load()
})

// Arama (debounce)
let searchTimer
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer)
  searchTimer = setTimeout(() => { searchQ = e.target.value.trim(); load() }, 250)
})

window.openDetail = async (id) => {
  const o = await api(`/orders/${id}`)
  const kalan = parseFloat(o.total_amount||0) - parseFloat(o.paid_amount||0)
  const pct = Math.min(100, Math.round(parseFloat(o.paid_amount||0)/parseFloat(o.total_amount||1)*100))
  const statuses = ['draft','payment_pending','confirmed','production_pending','in_production','quality_check','ready','shipped','completed','cancelled']
  openModal(`
    <div class="modal-header">
      <h3>${o.order_no || 'Sipariş #' + o.id} — ${o.customer_name}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row" style="margin-bottom:14px">
        <div>
          <div class="kpi-label">Toplam</div>
          <div class="td-bold" style="font-size:1.2rem">${money(o.total_amount)}</div>
        </div>
        <div>
          <div class="kpi-label">Ödenen</div>
          <div class="money-pos td-bold">${money(o.paid_amount)}</div>
        </div>
        <div>
          <div class="kpi-label">Kalan</div>
          <div class="${kalan>0?'money-neg':'money-pos'} td-bold">${kalan>0?money(kalan):'✓ Tamam'}</div>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${pct}%;background:${pct>=33?'var(--primary)':'var(--yellow)'}"></div>
        </div>
        <div class="td-muted" style="font-size:.75rem;margin-top:4px">
          %${pct} ödendi ${pct<33?'— ⚠️ Üretim için %33 gerekli':'— ✓ Üretim başlatılabilir'}
        </div>
      </div>

      <div class="section-title" style="margin-bottom:10px">Ürünler</div>
      ${o.items.map(item => `
        <div style="background:var(--surface-2);border-radius:8px;padding:10px 14px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <span class="td-bold">${item.product_code}</span>
              <span style="color:var(--text-secondary);margin:0 6px">·</span>
              ${item.product_name}
              ${item.variant_name?`<span class="chip chip-gray" style="margin-left:6px">${item.variant_name}</span>`:''}
            </div>
            <div class="td-mono">${money(item.unit_price)} × ${item.quantity}</div>
          </div>
          ${item.personalization?`<div style="margin-top:4px;font-size:.8rem;color:var(--text-secondary)">✏️ ${item.personalization}</div>`:''}
        </div>
      `).join('')}

      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <div class="form-group" style="flex:1;margin:0">
          <label class="form-label">Durum Güncelle</label>
          <select id="new-status" class="form-control">
            ${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn btn-primary" onclick="updateStatus(${o.id})">Güncelle</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" onclick="confirmDeleteOrder(${o.id})">Siparişi Sil</button>
      <div style="flex:1"></div>
      <button class="btn btn-secondary btn-sm" onclick="openPayment(${o.id},${o.total_amount},${o.paid_amount})">+ Ödeme Ekle</button>
      <button class="btn btn-secondary" onclick="closeModal()">Kapat</button>
    </div>
  `, 'modal-lg')
}

window.confirmDeleteOrder = (id) => {
  const o = orders.find(x => x.id === id) || {}
  const paid = parseFloat(o.paid_amount || 0)
  openModal(`
    <div class="modal-header"><h3>Siparişi Sil</h3>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:.87rem;line-height:1.6;margin:0 0 12px">
        <b>${o.order_no || '#'+id}</b> — ${o.customer_name || ''} siparişi iptal edilecek
        ve listelerden kaldırılacak. Kayıt geçmişte izlenebilir kalır.
      </p>
      ${paid > 0 ? `<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:8px;padding:10px 14px;font-size:.82rem;margin-bottom:12px">
        ⚠️ Bu siparişin <b>${money(paid)}</b> tahsilatı var. Silince bu tutar
        kasadan ters kayıtla geri alınacak.</div>` : ''}
      <div class="form-group">
        <label class="form-label">Silme sebebi</label>
        <input id="del-reason" class="form-control" placeholder="Müşteri vazgeçti, yanlış giriş..." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Vazgeç</button>
      <button class="btn btn-danger" onclick="doDeleteOrder(${id})">Evet, Sil</button>
    </div>
  `)
}

window.doDeleteOrder = async (id) => {
  const reason = document.getElementById('del-reason').value.trim()
  try {
    const r = await api(`/orders/${id}`, { method: 'DELETE', body: { reason } })
    closeModal()
    toast(r.reversed_amount > 0
      ? `Sipariş silindi — ${money(r.reversed_amount)} kasadan geri alındı`
      : 'Sipariş silindi')
    await loadMonths(); load()
  } catch (e) { toast(e.message, 'error') }
}

function statusLabel(s) {
  const m = { draft:'Taslak', payment_pending:'Ödeme Bekliyor', confirmed:'Onaylandı',
    production_pending:'Üretim Bekliyor', in_production:'Üretimde', quality_check:'Kalite Kontrol',
    ready:'Hazır', shipped:'Kargolandı', completed:'Tamamlandı', cancelled:'İptal' }
  return m[s]||s
}

window.updateStatus = async (id) => {
  const status = document.getElementById('new-status').value
  try {
    await api(`/orders/${id}/status`, { method:'PATCH', body:{status} })
    toast('Durum güncellendi')
    closeModal()
    load()
  } catch(e) { toast(e.message,'error') }
}

window.openPayment = async (id, total, paid) => {
  try {
    const [accounts, supData] = await Promise.all([api('/finance/accounts'), api('/suppliers')])
    const suppliers = Array.isArray(supData) ? supData : (supData?.items || [])
    const kalan = Math.max(0, total - paid)
    window.__paymentKalan = kalan
    window.__paymentSuppliers = suppliers

  openModal(`
    <div class="modal-header">
      <h3>Ödeme Ekle — Sipariş #${id}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="background:var(--surface-2);border-radius:8px;padding:10px 14px;margin-bottom:14px">
        <span>Toplam: <b>${money(total)}</b></span>
        <span style="margin:0 12px">Ödenen: <b class="money-pos">${money(paid)}</b></span>
        <span>Kalan: <b class="money-neg" id="p-kalan-display">${money(kalan)}</b></span>
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label class="form-label">Ödeme Yöntemi *</label>
        <select id="p-method" class="form-control" onchange="onPaymentMethodChange()">
          <option value="account">Hesaba Tahsilat (Banka / Kasa)</option>
          <option value="direct_to_supplier">Tedarikçiye Doğrudan Ödeme</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tutar *</label>
          <input id="p-amount" class="form-control" type="number" step="0.01" placeholder="0" value="${kalan}" oninput="onPaymentAmountInput()" />
          <div id="p-limit-hint" style="font-size:0.75rem;color:var(--text-muted);margin-top:4px">Maksimum: ${money(kalan)}</div>
        </div>
        <div class="form-group" id="p-account-wrap">
          <label class="form-label">Hesap *</label>
          <select id="p-account" class="form-control">
            ${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" id="p-supplier-wrap" style="display:none">
          <label class="form-label">Tedarikçi (Malzeme) *</label>
          <select id="p-supplier" class="form-control" onchange="onPaymentSupplierChange()">
            <option value="">Seçiniz</option>
            ${suppliers.map(s => {
              const debt = parseFloat(s.total_debt) || 0
              return `<option value="${s.id}" data-debt="${debt}">${s.name} (Borç: ${money(debt)})</option>`
            }).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Açıklama</label>
        <input id="p-desc" class="form-control" placeholder="Kapora, kalan ödeme vb." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="savePayment(${id})">Kaydet</button>
    </div>
  `)
  } catch(e) { toast(e.message, 'error') }
}

window.onPaymentMethodChange = () => {
  const method = document.getElementById('p-method').value
  const accWrap = document.getElementById('p-account-wrap')
  const supWrap = document.getElementById('p-supplier-wrap')
  if (method === 'direct_to_supplier') {
    accWrap.style.display = 'none'
    supWrap.style.display = 'block'
    onPaymentSupplierChange()
  } else {
    accWrap.style.display = 'block'
    supWrap.style.display = 'none'
    const kalan = window.__paymentKalan || 0
    document.getElementById('p-limit-hint').textContent = `Maksimum: ${money(kalan)}`
  }
}

window.onPaymentSupplierChange = () => {
  const supSel = document.getElementById('p-supplier')
  const selectedOpt = supSel.options[supSel.selectedIndex]
  const supDebt = parseFloat(selectedOpt?.dataset?.debt || 0)
  const kalan = window.__paymentKalan || 0
  const maxAllowed = Math.min(kalan, supDebt)
  const hintEl = document.getElementById('p-limit-hint')
  if (!supSel.value) {
    hintEl.textContent = 'Önce tedarikçi seçiniz'
    return
  }
  hintEl.textContent = `Tedarikçi borcu: ${money(supDebt)} · Maksimum tahsilat: ${money(maxAllowed)}`
  const amtInput = document.getElementById('p-amount')
  if (parseFloat(amtInput.value) > maxAllowed) {
    amtInput.value = maxAllowed > 0 ? maxAllowed : 0
  }
}

window.onPaymentAmountInput = () => {
  const method = document.getElementById('p-method')?.value
  const amt = parseFloat(document.getElementById('p-amount')?.value || 0)
  const kalan = window.__paymentKalan || 0
  if (method === 'direct_to_supplier') {
    const supSel = document.getElementById('p-supplier')
    const selectedOpt = supSel?.options[supSel.selectedIndex]
    const supDebt = parseFloat(selectedOpt?.dataset?.debt || 0)
    const maxAllowed = Math.min(kalan, supDebt)
    if (amt > maxAllowed + 0.005) {
      document.getElementById('p-limit-hint').innerHTML = `<span style="color:var(--red)">Uyarı: Girilen tutar limiti aşıyor (Maks: ${money(maxAllowed)})</span>`
    } else {
      document.getElementById('p-limit-hint').innerHTML = `Tedarikçi borcu: ${money(supDebt)} · Maksimum tahsilat: ${money(maxAllowed)}`
    }
  } else {
    if (amt > kalan + 0.005) {
      document.getElementById('p-limit-hint').innerHTML = `<span style="color:var(--red)">Uyarı: Açık alacak aşılıyor (Maks: ${money(kalan)})</span>`
    } else {
      document.getElementById('p-limit-hint').innerHTML = `Maksimum: ${money(kalan)}`
    }
  }
}

window.savePayment = async (id) => {
  const method = document.getElementById('p-method').value
  const amount = parseFloat(document.getElementById('p-amount').value)
  const description = document.getElementById('p-desc').value
  const kalan = window.__paymentKalan || 0

  if (!amount || amount <= 0) { toast('Geçerli tutar girin','error'); return }
  if (amount > kalan + 0.005) { toast(`Tutar siparişin kalan tutarını (${money(kalan)}) aşamaz`,'error'); return }

  const body = { amount, description, payment_method: method }

  if (method === 'direct_to_supplier') {
    const supplier_id = document.getElementById('p-supplier').value
    if (!supplier_id) { toast('Lütfen tedarikçi seçin','error'); return }
    const supSel = document.getElementById('p-supplier')
    const selectedOpt = supSel.options[supSel.selectedIndex]
    const supDebt = parseFloat(selectedOpt?.dataset?.debt || 0)
    if (amount > supDebt + 0.005) {
      toast(`Tutar tedarikçinin mevcut borcunu (${money(supDebt)}) aşamaz`,'error')
      return
    }
    body.supplier_id = parseInt(supplier_id)
  } else {
    const account_id = document.getElementById('p-account').value
    if (!account_id) { toast('Lütfen hesap seçin','error'); return }
    body.account_id = account_id
  }

  try {
    await api(`/orders/${id}/payments`, { method:'POST', body })
    toast('Ödeme kaydedildi')
    closeModal()
    load()
  } catch(e) { toast(e.message,'error') }
}

// Yeni sipariş — adımlı modal
window.openNewOrder = async () => {
  const [customers, products] = await Promise.all([api('/customers'), api('/products')])
  let step = 1
  let selectedCustomer = null
  let items = []

  function renderStep() {
    if (step === 1) renderStep1()
    else if (step === 2) renderStep2()
    else renderStep3()
  }

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))

  function renderStep1() {
    openModal(`
      <div class="modal-header"><h3>Yeni Sipariş — Müşteri Seç (1/3)</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <input id="cust-search" class="form-control" autocomplete="off"
          placeholder="Müşteri adı veya telefon yazın..." style="margin-bottom:10px"
          value="${esc(selectedCustomer?.name || '')}" />
        <div id="cust-list" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px"></div>
        <div id="quick-form"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
        <button class="btn btn-primary" id="btn-next1" onclick="goStep2()" ${selectedCustomer?'':'disabled'}>Devam</button>
      </div>
    `)
    const input = document.getElementById('cust-search')
    let timer
    input.addEventListener('input', () => {
      clearTimeout(timer)
      timer = setTimeout(() => searchCustomers(input.value.trim()), 220)
    })
    searchCustomers(input.value.trim())
    input.focus()
  }

  async function searchCustomers(q) {
    const list = document.getElementById('cust-list')
    if (!list) return
    // 3 harften azsa önden yüklenen listede filtrele, sonrası sunucu araması
    let rows
    if (q.length < 3) {
      const lq = q.toLocaleLowerCase('tr')
      rows = q ? customers.filter(c => c.name.toLocaleLowerCase('tr').includes(lq)) : customers
      rows = rows.slice(0, 50)
    } else {
      rows = await api('/customers?q=' + encodeURIComponent(q))
    }

    list.innerHTML = rows.map(c => `
      <div class="cust-item" data-id="${c.id}" data-name="${esc(c.name)}"
        style="padding:10px 14px;border-radius:8px;cursor:pointer;background:var(--surface-2);
        border:1px solid ${selectedCustomer?.id===c.id ? 'var(--primary)' : 'var(--border)'}">
        <div class="td-bold">${esc(c.name)}</div>
        <div class="td-muted" style="font-size:.78rem">
          ${esc(c.phone || '')}${c.city ? ' · ' + esc(c.city) : ''}
        </div>
      </div>`).join('')

    if (!rows.length) {
      list.innerHTML = `
        <div style="padding:14px;text-align:center;color:var(--text-secondary);font-size:.84rem">
          "${esc(q)}" için kayıt bulunamadı
        </div>
        <button class="btn btn-primary btn-sm" id="btn-quick-new">
          ➕ "${esc(q)}" için yeni müşteri oluştur
        </button>`
      document.getElementById('btn-quick-new').onclick = () => renderQuickForm(q)
    }

    list.querySelectorAll('.cust-item').forEach(el => el.onclick = () => {
      selectedCustomer = { id: parseInt(el.dataset.id, 10), name: el.dataset.name }
      list.querySelectorAll('.cust-item').forEach(e => e.style.border = '1px solid var(--border)')
      el.style.border = '1px solid var(--primary)'
      document.getElementById('btn-next1').disabled = false
      document.getElementById('quick-form').innerHTML = ''
    })
  }

  // Akış içinde hızlı müşteri kaydı
  function renderQuickForm(name) {
    document.getElementById('cust-list').innerHTML = ''
    document.getElementById('quick-form').innerHTML = `
      <div style="background:var(--surface-2);border-radius:9px;padding:14px;margin-top:4px">
        <div class="section-title" style="margin-bottom:10px">Yeni Müşteri</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Ad Soyad *</label>
            <input id="q-name" class="form-control" value="${esc(name)}" /></div>
          <div class="form-group"><label class="form-label">Telefon</label>
            <input id="q-phone" class="form-control" placeholder="5xx xxx xx xx" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">İl</label>
            <input id="q-city" class="form-control" /></div>
          <div class="form-group"><label class="form-label">İlçe</label>
            <input id="q-district" class="form-control" /></div>
        </div>
        <div class="form-group"><label class="form-label">Adres</label>
          <input id="q-address" class="form-control" placeholder="Mahalle, cadde, no..." /></div>
        <div class="form-group" style="margin-bottom:10px"><label class="form-label">Kaynak</label>
          <select id="q-channel" class="form-control">
            <option value="">—</option>
            <option value="instagram">Instagram</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="web">Web Sitesi</option>
            <option value="direct">Yüz yüze</option>
          </select></div>
        <button class="btn btn-primary btn-sm" id="q-save">Müşteriyi Kaydet ve Devam Et</button>
      </div>`
    document.getElementById('q-save').onclick = saveQuickCustomer
    document.getElementById('q-name').focus()
  }

  async function saveQuickCustomer() {
    const g = id => document.getElementById(id).value.trim()
    if (!g('q-name')) { toast('Ad soyad zorunlu', 'error'); return }
    try {
      const c = await api('/customers', { method: 'POST', body: {
        name: g('q-name'), phone: g('q-phone') || null, city: g('q-city') || null,
        district: g('q-district') || null, address: g('q-address') || null,
        channel: document.getElementById('q-channel').value || null } })
      customers.push(c)
      selectedCustomer = { id: c.id, name: c.name }
      toast(`${c.name} oluşturuldu`)
      step = 2; renderStep()
    } catch (e) { toast(e.message, 'error') }
  }

  window.goStep2 = () => { step=2; renderStep() }

  function renderStep2() {
    openModal(`
      <div class="modal-header"><h3>Yeni Sipariş — Ürün Ekle (2/3)</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div id="items-list" style="margin-bottom:14px">${renderItemsList()}</div>
        <div style="background:var(--surface-2);border-radius:8px;padding:12px 14px">
          <div class="form-row-3">
            <div class="form-group" style="margin:0">
              <label class="form-label">Ürün</label>
              <select id="sel-product" class="form-control" onchange="onProductChange()">
                <option value="">Seçin...</option>
                ${products.map(p=>`<option value="${p.id}" data-price="${p.base_price}" data-pers="${p.allows_personalization}">${p.code} — ${p.name}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">Fiyat</label>
              <input id="sel-price" class="form-control" type="number" placeholder="0" />
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">Adet</label>
              <input id="sel-qty" class="form-control" type="number" value="1" min="1" />
            </div>
          </div>
          <div class="form-row" style="margin-top:8px">
            <div class="form-group" style="margin:0">
              <label class="form-label">Deri / Renk</label>
              <input id="sel-material" class="form-control" placeholder="Kaşmir Yeşil, Crazy Siyah..." />
            </div>
            <div class="form-group" style="margin:0" id="pers-group" style="display:none">
              <label class="form-label">İsim Baskısı</label>
              <input id="sel-pers" class="form-control" placeholder="AHMET, MERAL..." />
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="addItem()">+ Ekle</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="step=1;renderStep()">Geri</button>
        <button class="btn btn-primary" onclick="goStep3()" ${items.length?'':'disabled'} id="btn-next2">Devam</button>
      </div>
    `, 'modal-lg')
  }

  window.onProductChange = () => {
    const opt = document.querySelector('#sel-product option:checked')
    document.getElementById('sel-price').value = opt?.dataset.price || ''
    document.getElementById('pers-group').style.display = opt?.dataset.pers==='true' ? '' : 'none'
  }

  window.addItem = () => {
    const productId = document.getElementById('sel-product').value
    const productOpt = document.querySelector('#sel-product option:checked')
    const price = parseFloat(document.getElementById('sel-price').value)||0
    const qty = parseInt(document.getElementById('sel-qty').value)||1
    const material = document.getElementById('sel-material').value.trim()
    const pers = document.getElementById('sel-pers').value.trim()
    if (!productId) { toast('Ürün seçin','error'); return }
    items.push({ product_id:parseInt(productId), product_label:productOpt.textContent, unit_price:price, quantity:qty, material_note:material, personalization:pers||null })
    renderStep()
  }

  window.removeItem = (i) => { items.splice(i,1); renderStep() }

  function renderItemsList() {
    if (!items.length) return `<div class="td-muted" style="font-size:.85rem">Henüz ürün eklenmedi.</div>`
    return items.map((it,i)=>`
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:7px;padding:8px 12px;margin-bottom:6px">
        <div>
          <span class="td-bold">${it.product_label}</span>
          ${it.material_note?`<span class="td-muted"> · ${it.material_note}</span>`:''}
          ${it.personalization?`<span class="td-muted"> · ✏️ ${it.personalization}</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span>${money(it.unit_price)} × ${it.quantity}</span>
          <button class="btn btn-danger btn-icon btn-sm" onclick="removeItem(${i})">✕</button>
        </div>
      </div>
    `).join('')
  }

  window.goStep3 = () => { if (items.length) { step=3; renderStep() } }

  async function renderStep3() {
    const accounts = await api('/finance/accounts')
    const total = items.reduce((s,it)=>s+it.unit_price*it.quantity,0)
    openModal(`
      <div class="modal-header"><h3>Yeni Sipariş — Ödeme (3/3)</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="background:var(--surface-2);border-radius:8px;padding:12px 14px;margin-bottom:16px">
          <div class="td-muted" style="margin-bottom:4px">Müşteri: <b style="color:var(--text)">${selectedCustomer.name}</b></div>
          <div class="td-muted">${items.length} ürün · Toplam: <b style="color:var(--text);font-size:1.1rem">${money(total)}</b></div>
        </div>
        <div class="form-group">
          <label class="form-label">Ödeme Durumu</label>
          <select id="pay-type" class="form-control" onchange="onPayTypeChange()">
            <option value="none">Ödeme alınmadı</option>
            <option value="partial">Kapora alındı</option>
            <option value="full">Tam ödeme</option>
          </select>
        </div>
        <div id="pay-fields" style="display:none">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tutar</label>
              <input id="pay-amount" class="form-control" type="number" value="${total}" />
            </div>
            <div class="form-group">
              <label class="form-label">Hesap</label>
              <select id="pay-account" class="form-control">
                ${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Teslimat Tarihi</label>
          <input id="delivery-date" class="form-control" type="date" />
        </div>
        <div class="form-group">
          <label class="form-label">Sipariş Kaynağı</label>
          <select id="order-source" class="form-control">
            <option value="">—</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="instagram">Instagram / Meta</option>
            <option value="web">Web</option>
            <option value="direct">Yüz yüze</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="step=2;renderStep()">Geri</button>
        <button class="btn btn-primary" onclick="submitOrder()">Siparişi Oluştur</button>
      </div>
    `)
  }

  window.onPayTypeChange = () => {
    const t = document.getElementById('pay-type').value
    document.getElementById('pay-fields').style.display = t==='none' ? 'none' : ''
    if (t==='full') document.getElementById('pay-amount').value = items.reduce((s,it)=>s+it.unit_price*it.quantity,0)
  }

  window.submitOrder = async () => {
    const payType = document.getElementById('pay-type').value
    const payAmount = parseFloat(document.getElementById('pay-amount')?.value)||0
    const payAccount = document.getElementById('pay-account')?.value
    const deliveryDate = document.getElementById('delivery-date').value
    const source = document.getElementById('order-source').value

    const orderItems = items.map(it=>({
      product_id: it.product_id,
      quantity: it.quantity,
      unit_price: it.unit_price,
      personalization: it.personalization,
      material_selections: it.material_note ? { note: it.material_note } : {},
    }))

    try {
      const order = await api('/orders', { method:'POST', body:{
        customer_id: selectedCustomer.id,
        source: source||null,
        delivery_date: deliveryDate||null,
        items: orderItems,
      }})

      if (payType !== 'none' && payAmount > 0) {
        await api(`/orders/${order.id}/payments`, { method:'POST', body:{
          amount: payAmount,
          account_id: payAccount,
          description: payType==='partial' ? 'Kapora' : 'Tam ödeme',
        }})
      }

      toast('Sipariş oluşturuldu 🎉')
      closeModal()
      await loadMonths(); load()
    } catch(e) { toast(e.message,'error') }
  }

  renderStep()
}

window.closeModal = closeModal
;(async () => { await loadMonths(); await load() })()
</script>
</body>
</html>
