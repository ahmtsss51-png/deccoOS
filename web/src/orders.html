<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Siparişler — Decco OS</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">Decco<span class="logo-dot">●</span>OS<span>Üretim Yönetim Sistemi</span></div>
  <div class="nav"></div>
  <div class="sidebar-footer">Decco Deri © 2026</div>
</nav>

<main class="main">
  <div class="page-header">
    <div><h1>Siparişler</h1></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="openNewOrder()">+ Yeni Sipariş</button>
    </div>
  </div>

  <div class="filter-tabs" id="filter-tabs">
    <button class="filter-tab active" data-status="">Tümü</button>
    <button class="filter-tab" data-status="payment_pending">Ödeme Bekliyor</button>
    <button class="filter-tab" data-status="production_pending">Üretim Bekliyor</button>
    <button class="filter-tab" data-status="in_production">Üretimde</button>
    <button class="filter-tab" data-status="ready">Hazır</button>
    <button class="filter-tab" data-status="overdue">Geciken</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Müşteri</th><th>Ürünler</th><th>Toplam</th><th>Kalan</th><th>Teslim</th><th>Durum</th><th></th></tr>
        </thead>
        <tbody id="orders-body">
          <tr><td colspan="8" class="td-muted" style="text-align:center;padding:32px">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div id="toast-container"></div>

<script type="module">
import { api, money, chip, toast, openModal, closeModal, renderSidebar, fmtDate } from '/js/shared.js'
renderSidebar('orders')

let activeStatus = ''
let orders = []

async function load() {
  const url = activeStatus === 'overdue'
    ? '/orders'
    : `/orders${activeStatus ? '?status='+activeStatus : ''}`
  orders = await api(url)
  if (activeStatus === 'overdue') {
    const now = new Date()
    orders = orders.filter(o => o.delivery_date && new Date(o.delivery_date) < now && !['completed','cancelled'].includes(o.status))
  }
  render()
}

function render() {
  const body = document.getElementById('orders-body')
  if (!orders.length) {
    body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div><div>Sipariş bulunamadı</div></div></td></tr>`
    return
  }
  body.innerHTML = orders.map(o => {
    const kalan = parseFloat(o.total_amount||0) - parseFloat(o.paid_amount||0)
    const isOverdue = o.delivery_date && new Date(o.delivery_date) < new Date() && !['completed','cancelled','shipped'].includes(o.status)
    return `<tr onclick="openDetail(${o.id})" style="${isOverdue?'border-left:3px solid var(--red)':''}">
      <td class="td-bold">#${o.id}</td>
      <td>${o.customer_name}</td>
      <td class="td-muted">${o.item_count} ürün</td>
      <td class="td-mono td-bold">${money(o.total_amount)}</td>
      <td class="td-mono ${kalan>0?'money-neg':'money-pos'}">${kalan>0?money(kalan):'✓ Tamam'}</td>
      <td class="td-muted">${fmtDate(o.delivery_date)}</td>
      <td>${chip(o.status)}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openPayment(${o.id},${o.total_amount},${o.paid_amount})">Ödeme</button></td>
    </tr>`
  }).join('')
}

// Tab filtreler
document.getElementById('filter-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab')
  if (!tab) return
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'))
  tab.classList.add('active')
  activeStatus = tab.dataset.status
  load()
})

window.openDetail = async (id) => {
  const o = await api(`/orders/${id}`)
  const kalan = parseFloat(o.total_amount||0) - parseFloat(o.paid_amount||0)
  const pct = Math.min(100, Math.round(parseFloat(o.paid_amount||0)/parseFloat(o.total_amount||1)*100))
  const statuses = ['draft','payment_pending','confirmed','production_pending','in_production','quality_check','ready','shipped','completed','cancelled']
  openModal(`
    <div class="modal-header">
      <h3>Sipariş #${o.id} — ${o.customer_name}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row" style="margin-bottom:14px">
        <div>
          <div class="kpi-label">Toplam</div>
          <div class="td-bold" style="font-size:1.2rem">${money(o.total_amount)}</div>
        </div>
        <div>
          <div class="kpi-label">Ödenen</div>
          <div class="money-pos td-bold">${money(o.paid_amount)}</div>
        </div>
        <div>
          <div class="kpi-label">Kalan</div>
          <div class="${kalan>0?'money-neg':'money-pos'} td-bold">${kalan>0?money(kalan):'✓ Tamam'}</div>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${pct}%;background:${pct>=33?'var(--primary)':'var(--yellow)'}"></div>
        </div>
        <div class="td-muted" style="font-size:.75rem;margin-top:4px">
          %${pct} ödendi ${pct<33?'— ⚠️ Üretim için %33 gerekli':'— ✓ Üretim başlatılabilir'}
        </div>
      </div>

      <div class="section-title" style="margin-bottom:10px">Ürünler</div>
      ${o.items.map(item => `
        <div style="background:var(--surface-2);border-radius:8px;padding:10px 14px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <span class="td-bold">${item.product_code}</span>
              <span style="color:var(--text-secondary);margin:0 6px">·</span>
              ${item.product_name}
              ${item.variant_name?`<span class="chip chip-gray" style="margin-left:6px">${item.variant_name}</span>`:''}
            </div>
            <div class="td-mono">${money(item.unit_price)} × ${item.quantity}</div>
          </div>
          ${item.personalization?`<div style="margin-top:4px;font-size:.8rem;color:var(--text-secondary)">✏️ ${item.personalization}</div>`:''}
        </div>
      `).join('')}

      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <div class="form-group" style="flex:1;margin:0">
          <label class="form-label">Durum Güncelle</label>
          <select id="new-status" class="form-control">
            ${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn btn-primary" onclick="updateStatus(${o.id})">Güncelle</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" onclick="openPayment(${o.id},${o.total_amount},${o.paid_amount})">+ Ödeme Ekle</button>
      <button class="btn btn-secondary" onclick="closeModal()">Kapat</button>
    </div>
  `, 'modal-lg')
}

function statusLabel(s) {
  const m = { draft:'Taslak', payment_pending:'Ödeme Bekliyor', confirmed:'Onaylandı',
    production_pending:'Üretim Bekliyor', in_production:'Üretimde', quality_check:'Kalite Kontrol',
    ready:'Hazır', shipped:'Kargolandı', completed:'Tamamlandı', cancelled:'İptal' }
  return m[s]||s
}

window.updateStatus = async (id) => {
  const status = document.getElementById('new-status').value
  try {
    await api(`/orders/${id}/status`, { method:'PATCH', body:{status} })
    toast('Durum güncellendi')
    closeModal()
    load()
  } catch(e) { toast(e.message,'error') }
}

window.openPayment = async (id, total, paid) => {
  const accounts = await api('/finance/accounts')
  openModal(`
    <div class="modal-header">
      <h3>Ödeme Ekle — Sipariş #${id}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="background:var(--surface-2);border-radius:8px;padding:10px 14px;margin-bottom:14px">
        <span>Toplam: <b>${money(total)}</b></span>
        <span style="margin:0 12px">Ödenen: <b class="money-pos">${money(paid)}</b></span>
        <span>Kalan: <b class="money-neg">${money(total-paid)}</b></span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tutar *</label>
          <input id="p-amount" class="form-control" type="number" placeholder="0" value="${Math.max(0,total-paid)}" />
        </div>
        <div class="form-group">
          <label class="form-label">Hesap *</label>
          <select id="p-account" class="form-control">
            ${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Açıklama</label>
        <input id="p-desc" class="form-control" placeholder="Kapora, kalan ödeme vb." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="savePayment(${id})">Kaydet</button>
    </div>
  `)
}

window.savePayment = async (id) => {
  const amount = parseFloat(document.getElementById('p-amount').value)
  const account_id = document.getElementById('p-account').value
  const description = document.getElementById('p-desc').value
  if (!amount || amount <= 0) { toast('Geçerli tutar girin','error'); return }
  try {
    await api(`/orders/${id}/payments`, { method:'POST', body:{ amount, account_id, description } })
    toast('Ödeme kaydedildi')
    closeModal()
    load()
  } catch(e) { toast(e.message,'error') }
}

// Yeni sipariş — adımlı modal
window.openNewOrder = async () => {
  const [customers, products] = await Promise.all([api('/customers'), api('/products')])
  let step = 1
  let selectedCustomer = null
  let items = []

  function renderStep() {
    if (step === 1) renderStep1()
    else if (step === 2) renderStep2()
    else renderStep3()
  }

  function renderStep1() {
    openModal(`
      <div class="modal-header"><h3>Yeni Sipariş — Müşteri Seç (1/3)</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <input id="cust-search" class="form-control" placeholder="Müşteri ara..." oninput="filterCust()" style="margin-bottom:10px" />
        <div id="cust-list" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
          ${customers.map(c=>`<div class="cust-item" data-id="${c.id}" data-name="${c.name}" onclick="selectCust(${c.id},'${c.name.replace(/'/g,"\\'")}',this)"
            style="padding:10px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--surface-2)">
            <div class="td-bold">${c.name}</div>
            <div class="td-muted">${c.phone||''}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
        <button class="btn btn-primary" id="btn-next1" onclick="goStep2()" disabled>Devam</button>
      </div>
    `)
  }

  window.filterCust = () => {
    const q = document.getElementById('cust-search').value.toLowerCase()
    document.querySelectorAll('.cust-item').forEach(el => {
      el.style.display = el.dataset.name.toLowerCase().includes(q) ? '' : 'none'
    })
  }
  window.selectCust = (id, name, el) => {
    selectedCustomer = { id, name }
    document.querySelectorAll('.cust-item').forEach(e => e.style.border='1px solid var(--border)')
    el.style.border = '1px solid var(--primary)'
    document.getElementById('btn-next1').disabled = false
  }
  window.goStep2 = () => { step=2; renderStep() }

  function renderStep2() {
    openModal(`
      <div class="modal-header"><h3>Yeni Sipariş — Ürün Ekle (2/3)</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div id="items-list" style="margin-bottom:14px">${renderItemsList()}</div>
        <div style="background:var(--surface-2);border-radius:8px;padding:12px 14px">
          <div class="form-row-3">
            <div class="form-group" style="margin:0">
              <label class="form-label">Ürün</label>
              <select id="sel-product" class="form-control" onchange="onProductChange()">
                <option value="">Seçin...</option>
                ${products.map(p=>`<option value="${p.id}" data-price="${p.base_price}" data-pers="${p.allows_personalization}">${p.code} — ${p.name}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">Fiyat</label>
              <input id="sel-price" class="form-control" type="number" placeholder="0" />
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">Adet</label>
              <input id="sel-qty" class="form-control" type="number" value="1" min="1" />
            </div>
          </div>
          <div class="form-row" style="margin-top:8px">
            <div class="form-group" style="margin:0">
              <label class="form-label">Deri / Renk</label>
              <input id="sel-material" class="form-control" placeholder="Kaşmir Yeşil, Crazy Siyah..." />
            </div>
            <div class="form-group" style="margin:0" id="pers-group" style="display:none">
              <label class="form-label">İsim Baskısı</label>
              <input id="sel-pers" class="form-control" placeholder="AHMET, MERAL..." />
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="addItem()">+ Ekle</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="step=1;renderStep()">Geri</button>
        <button class="btn btn-primary" onclick="goStep3()" ${items.length?'':'disabled'} id="btn-next2">Devam</button>
      </div>
    `, 'modal-lg')
  }

  window.onProductChange = () => {
    const opt = document.querySelector('#sel-product option:checked')
    document.getElementById('sel-price').value = opt?.dataset.price || ''
    document.getElementById('pers-group').style.display = opt?.dataset.pers==='true' ? '' : 'none'
  }

  window.addItem = () => {
    const productId = document.getElementById('sel-product').value
    const productOpt = document.querySelector('#sel-product option:checked')
    const price = parseFloat(document.getElementById('sel-price').value)||0
    const qty = parseInt(document.getElementById('sel-qty').value)||1
    const material = document.getElementById('sel-material').value.trim()
    const pers = document.getElementById('sel-pers').value.trim()
    if (!productId) { toast('Ürün seçin','error'); return }
    items.push({ product_id:parseInt(productId), product_label:productOpt.textContent, unit_price:price, quantity:qty, material_note:material, personalization:pers||null })
    renderStep()
  }

  window.removeItem = (i) => { items.splice(i,1); renderStep() }

  function renderItemsList() {
    if (!items.length) return `<div class="td-muted" style="font-size:.85rem">Henüz ürün eklenmedi.</div>`
    return items.map((it,i)=>`
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:7px;padding:8px 12px;margin-bottom:6px">
        <div>
          <span class="td-bold">${it.product_label}</span>
          ${it.material_note?`<span class="td-muted"> · ${it.material_note}</span>`:''}
          ${it.personalization?`<span class="td-muted"> · ✏️ ${it.personalization}</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span>${money(it.unit_price)} × ${it.quantity}</span>
          <button class="btn btn-danger btn-icon btn-sm" onclick="removeItem(${i})">✕</button>
        </div>
      </div>
    `).join('')
  }

  window.goStep3 = () => { if (items.length) { step=3; renderStep() } }

  async function renderStep3() {
    const accounts = await api('/finance/accounts')
    const total = items.reduce((s,it)=>s+it.unit_price*it.quantity,0)
    openModal(`
      <div class="modal-header"><h3>Yeni Sipariş — Ödeme (3/3)</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="background:var(--surface-2);border-radius:8px;padding:12px 14px;margin-bottom:16px">
          <div class="td-muted" style="margin-bottom:4px">Müşteri: <b style="color:var(--text)">${selectedCustomer.name}</b></div>
          <div class="td-muted">${items.length} ürün · Toplam: <b style="color:var(--text);font-size:1.1rem">${money(total)}</b></div>
        </div>
        <div class="form-group">
          <label class="form-label">Ödeme Durumu</label>
          <select id="pay-type" class="form-control" onchange="onPayTypeChange()">
            <option value="none">Ödeme alınmadı</option>
            <option value="partial">Kapora alındı</option>
            <option value="full">Tam ödeme</option>
          </select>
        </div>
        <div id="pay-fields" style="display:none">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tutar</label>
              <input id="pay-amount" class="form-control" type="number" value="${total}" />
            </div>
            <div class="form-group">
              <label class="form-label">Hesap</label>
              <select id="pay-account" class="form-control">
                ${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Teslimat Tarihi</label>
          <input id="delivery-date" class="form-control" type="date" />
        </div>
        <div class="form-group">
          <label class="form-label">Sipariş Kaynağı</label>
          <select id="order-source" class="form-control">
            <option value="">—</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="instagram">Instagram / Meta</option>
            <option value="web">Web</option>
            <option value="direct">Yüz yüze</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="step=2;renderStep()">Geri</button>
        <button class="btn btn-primary" onclick="submitOrder()">Siparişi Oluştur</button>
      </div>
    `)
  }

  window.onPayTypeChange = () => {
    const t = document.getElementById('pay-type').value
    document.getElementById('pay-fields').style.display = t==='none' ? 'none' : ''
    if (t==='full') document.getElementById('pay-amount').value = items.reduce((s,it)=>s+it.unit_price*it.quantity,0)
  }

  window.submitOrder = async () => {
    const payType = document.getElementById('pay-type').value
    const payAmount = parseFloat(document.getElementById('pay-amount')?.value)||0
    const payAccount = document.getElementById('pay-account')?.value
    const deliveryDate = document.getElementById('delivery-date').value
    const source = document.getElementById('order-source').value

    const orderItems = items.map(it=>({
      product_id: it.product_id,
      quantity: it.quantity,
      unit_price: it.unit_price,
      personalization: it.personalization,
      material_selections: it.material_note ? { note: it.material_note } : {},
    }))

    try {
      const order = await api('/orders', { method:'POST', body:{
        customer_id: selectedCustomer.id,
        source: source||null,
        delivery_date: deliveryDate||null,
        items: orderItems,
      }})

      if (payType !== 'none' && payAmount > 0) {
        await api(`/orders/${order.id}/payments`, { method:'POST', body:{
          amount: payAmount,
          account_id: payAccount,
          description: payType==='partial' ? 'Kapora' : 'Tam ödeme',
        }})
      }

      toast('Sipariş oluşturuldu 🎉')
      closeModal()
      load()
    } catch(e) { toast(e.message,'error') }
  }

  renderStep()
}

window.closeModal = closeModal
load()
</script>
</body>
</html>
